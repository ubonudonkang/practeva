# Pages CMS (app.pagescms.org) reads this file to decide what can be edited from the browser.
# Every key below must match a key in the JSON file it describes: scripts/test-content.mjs checks
# it, and src/data/content.ts checks the values when the site builds (a bad edit stops the build
# and the live site stays on the last good version). Notes on each file are in plans/004-pages-cms-migration.md.

content:
  - name: enrolment
    label: Enrolment
    type: file
    path: src/content/enrolment.json
    format: json
    fields:
      - name: open
        label: Enrolment open
        type: boolean
        description: "Off: the page offers the waitlist. On: the page takes enrolments and payments through Squad. Before turning it on, work through the Opening enrolment list in CLAUDE.md: change EXPECTED_AMOUNT in the Apps Script, redeploy both its deployments, and set the dates in Cohort facts. The site will not build if the amount is not confirmed or the dates are empty."
      - name: amount
        label: Fee in naira
        type: number
        description: "Whole naira, for example 80000. It must be the same number as EXPECTED_AMOUNT in the Apps Script. Leave 0 while enrolment is closed."
      - name: scriptAmountConfirmed
        label: Fee in the Apps Script (retype it)
        type: number
        description: "Type the fee again, only after you have changed EXPECTED_AMOUNT in the Apps Script and redeployed both deployments. The site will not build with enrolment open unless this equals the fee above."

  - name: cohort
    label: Cohort facts
    type: file
    path: src/content/cohort.json
    format: json
    fields:
      - name: next
        label: Next cohort
        type: string
        required: true
        description: "Month and year, for example February 2027. The waitlist form and its sheet entry follow this, so change it only when the next cohort changes."
      - name: nextStart
        label: Rough start
        type: string
        required: true
        description: "Used until the exact date is fixed, in the sentence 'starts at ...', for example the end of February."
      - name: startDate
        label: Start date
        type: string
        description: "The exact start date written in full, for example 2 February 2027. Leave empty until it is fixed. Required before enrolment opens."
      - name: applyBy
        label: Apply by
        type: string
        description: "The last day to apply, written in full, for example 25 January 2027. Leave empty until it is fixed. Required before enrolment opens."
      - name: previous
        label: Cohort that has just filled
        type: string
        required: true
        description: "Month and year, for example November 2026. The cohort card says '<month> is full'."
      - name: previousStatus
        label: Its status
        type: string
        required: true
        description: "A few words, for example Fully booked."
      - name: size
        label: Cohort size
        type: string
        required: true
        description: "For example 10 to 15 people."
      - name: format
        label: Format
        type: string
        required: true
        description: "For example Twelve weeks, live online."
      - name: schedule
        label: Schedule
        type: string
        required: true
        description: "Days and time in West Africa Time, for example Wednesdays and Saturdays, 8 to 10pm WAT. The table of local times on the page is worked out from 8 to 10pm WAT, so tell Claude if the hours change."
      - name: previousFee
        label: Previous fee
        type: string
        required: true
        description: "The fee of the cohort that has just filled, with the naira sign, for example ₦80,000. Quoted in the FAQ until the new fee is set."
      - name: abroadFee
        label: Fee for people abroad
        type: text
        required: true
        description: "The sentence about students outside Nigeria. There is no dollar fee for now."

  - name: programme
    label: The programme
    type: file
    path: src/content/programme.json
    format: json
    fields:
      - name: audiences
        label: Who it is for
        type: object
        list: true
        description: "Two to four groups. They appear as numbered columns, so keep each description to a sentence."
        fields:
          - name: name
            label: Group
            type: string
            required: true
          - name: detail
            label: Description
            type: text
            required: true
      - name: phases
        label: The 12 weeks
        type: object
        list: true
        description: "Two to eight phases, in order. The last one is drawn as the end of the process, in a deep-green box."
        fields:
          - name: weeks
            label: Weeks
            type: string
            required: true
            description: "For example Weeks 1 to 2."
          - name: name
            label: Phase
            type: string
            required: true
          - name: detail
            label: What is taught
            type: text
            required: true
          - name: tools
            label: Tools
            type: string
            required: true
          - name: deliverable
            label: Deliverable
            type: string
            required: true
      - name: includes
        label: What a place includes
        type: string
        list: true
        description: "One line each, up to 14. Do not promise jobs, salaries or certifications."

  - name: faqs-training
    label: "FAQ: training page"
    type: file
    path: src/content/faqs/training.json
    format: json
    fields:
      - name: questions
        label: Questions
        type: object
        list: true
        description: "Shown in this order on the training page, at most 20. Do not promise jobs, salaries or certifications."
        fields:
          - name: question
            label: Question
            type: string
            required: true
          - name: answer
            label: Answer
            type: text
            required: true
            description: "Facts can be written into an answer as {{name}} and are filled in when the site builds, so they stay right when the cohort changes: {{cohort.programme}}, {{cohort.next}}, {{cohort.previous}}, {{cohort.previousFee}}, {{cohort.fee}}, {{cohort.starts}}, {{cohort.applyBy}}, {{cohort.schedule}}, {{cohort.formatLower}}, {{cohort.abroadFee}}, {{markets.abroadCurrency}}, {{email}}. {{cohort.fee}} and {{cohort.applyBy}} are empty until enrolment opens, so use them only in the answer for when enrolment is open."
          - name: answerWhenOpen
            label: Answer when enrolment is open
            type: text
            description: "Leave empty if the answer is the same whether or not enrolment is open. If you fill it in, it is used instead of the answer above while enrolment is open."

  - name: faqs-home
    label: "FAQ: home page"
    type: file
    path: src/content/faqs/home.json
    format: json
    fields:
      - name: questions
        label: Questions
        type: object
        list: true
        description: "Questions about the company as a whole, shown in this order on the home page."
        fields:
          - name: question
            label: Question
            type: string
            required: true
          - name: answer
            label: Answer
            type: text
            required: true
            description: "Facts can be written into an answer as {{name}} and are filled in when the site builds, so they stay right when the cohort changes: {{cohort.programme}}, {{cohort.next}}, {{cohort.previous}}, {{cohort.previousFee}}, {{cohort.fee}}, {{cohort.starts}}, {{cohort.applyBy}}, {{cohort.schedule}}, {{cohort.formatLower}}, {{cohort.abroadFee}}, {{markets.abroadCurrency}}, {{email}}. {{cohort.fee}} and {{cohort.applyBy}} are empty until enrolment opens, so use them only in the answer for when enrolment is open."
          - name: answerWhenOpen
            label: Answer when enrolment is open
            type: text
            description: "Leave empty if the answer is the same whether or not enrolment is open. If you fill it in, it is used instead of the answer above while enrolment is open."

  - name: faqs-international
    label: "FAQ: advisory from abroad"
    type: file
    path: src/content/faqs/international.json
    format: json
    fields:
      - name: questions
        label: Questions
        type: object
        list: true
        description: "Shown in this order on the page for teams outside Nigeria."
        fields:
          - name: question
            label: Question
            type: string
            required: true
          - name: answer
            label: Answer
            type: text
            required: true
            description: "Facts can be written into an answer as {{name}} and are filled in when the site builds, so they stay right when the cohort changes: {{cohort.programme}}, {{cohort.next}}, {{cohort.previous}}, {{cohort.previousFee}}, {{cohort.fee}}, {{cohort.starts}}, {{cohort.applyBy}}, {{cohort.schedule}}, {{cohort.formatLower}}, {{cohort.abroadFee}}, {{markets.abroadCurrency}}, {{email}}. {{cohort.fee}} and {{cohort.applyBy}} are empty until enrolment opens, so use them only in the answer for when enrolment is open."
          - name: answerWhenOpen
            label: Answer when enrolment is open
            type: text
            description: "Leave empty if the answer is the same whether or not enrolment is open. If you fill it in, it is used instead of the answer above while enrolment is open."

  - name: faqs-guide
    label: "FAQ: the career-changer guide"
    type: file
    path: src/content/faqs/guide.json
    format: json
    fields:
      - name: questions
        label: Questions
        type: object
        list: true
        description: "Shown in this order at the foot of the guide to becoming a business analyst in Nigeria."
        fields:
          - name: question
            label: Question
            type: string
            required: true
          - name: answer
            label: Answer
            type: text
            required: true
            description: "Facts can be written into an answer as {{name}} and are filled in when the site builds, so they stay right when the cohort changes: {{cohort.programme}}, {{cohort.next}}, {{cohort.previous}}, {{cohort.previousFee}}, {{cohort.fee}}, {{cohort.starts}}, {{cohort.applyBy}}, {{cohort.schedule}}, {{cohort.formatLower}}, {{cohort.abroadFee}}, {{markets.abroadCurrency}}, {{email}}. {{cohort.fee}} and {{cohort.applyBy}} are empty until enrolment opens, so use them only in the answer for when enrolment is open."
          - name: answerWhenOpen
            label: Answer when enrolment is open
            type: text
            description: "Leave empty if the answer is the same whether or not enrolment is open. If you fill it in, it is used instead of the answer above while enrolment is open."

  - name: pillars
    label: "Home: the three pillars"
    type: file
    path: src/content/pillars.json
    format: json
    fields:
      - name: pillars
        label: "Pillars"
        type: object
        list: true
        description: "The three doors on the home page. Edit the words; the key and link must stay as they are, and the order is fixed."
        fields:
          - name: key
            label: "Key"
            type: string
            required: true
            description: "Sets the pillar colour. Do not change."
          - name: name
            label: "Name"
            type: string
            required: true
          - name: href
            label: "Link"
            type: string
            required: true
            description: "The page it opens, for example /advisory. Do not change."
          - name: tease
            label: "Who it is for"
            type: string
            required: true
            description: "A few words under the name."
          - name: line
            label: "One line"
            type: text
            required: true

  - name: advisory
    label: "Advisory page"
    type: file
    path: src/content/advisory.json
    format: json
    fields:
      - name: audiences
        label: "Who we help"
        type: object
        list: true
        description: "Two to four groups, shown as numbered columns."
        fields:
          - name: name
            label: "Group"
            type: string
            required: true
          - name: detail
            label: "Description"
            type: text
            required: true
      - name: beforeAfter
        label: "Before and after"
        type: object
        fields:
          - name: before
            label: "Without a plan"
            type: object
            fields:
              - name: label
                label: "Heading"
                type: string
                required: true
              - name: items
                label: "Points"
                type: string
                list: true
                description: "One to five short lines."
          - name: after
            label: "With Practeva"
            type: object
            fields:
              - name: label
                label: "Heading"
                type: string
                required: true
              - name: items
                label: "Points"
                type: string
                list: true
                description: "One to five short lines."
      - name: services
        label: "What we take on"
        type: object
        list: true
        description: "Three to twelve, shown in columns of three."
        fields:
          - name: name
            label: "Service"
            type: string
            required: true
          - name: detail
            label: "Description"
            type: text
            required: true
      - name: engagement
        label: "How an engagement runs"
        type: object
        list: true
        description: "Three to five steps, drawn as a process. Names of two to four words; details under eight."
        fields:
          - name: name
            label: "Step"
            type: string
            required: true
          - name: detail
            label: "Short detail"
            type: text
            required: true

  - name: packages
    label: "Advisory packages"
    type: file
    path: src/content/packages.json
    format: json
    fields:
      - name: packages
        label: "Packages"
        type: object
        list: true
        description: "Up to six. Shown on the advisory and home pages."
        fields:
          - name: slug
            label: "Link name"
            type: string
            required: true
            description: "Lower case words joined by hyphens. The contact form uses it to preselect this offer in links, so change it only if you also change the links that point to it."
          - name: name
            label: "Name"
            type: string
            required: true
          - name: tag
            label: "Tag"
            type: string
            required: true
            description: "One or two words above the name, for example Start here."
          - name: summary
            label: "Summary"
            type: text
            required: true
          - name: includes
            label: "What it includes"
            type: string
            list: true
            description: "One to six short lines."
          - name: bestFor
            label: "Best for"
            type: string
            required: true
          - name: price
            label: "Price"
            type: string
            description: "Leave empty to show 'Quoted after an intro call'. Only put a price here once it is fixed."

  - name: careers
    label: "Careers page"
    type: file
    path: src/content/careers.json
    format: json
    fields:
      - name: services
        label: "Services"
        type: object
        list: true
        description: "Up to six."
        fields:
          - name: slug
            label: "Link name"
            type: string
            required: true
            description: "Lower case words joined by hyphens. The contact form uses it to preselect this offer in links, so change it only if you also change the links that point to it."
          - name: name
            label: "Name"
            type: string
            required: true
          - name: summary
            label: "Summary"
            type: text
            required: true
          - name: includes
            label: "What it includes"
            type: string
            list: true
            description: "One to six short lines."
          - name: price
            label: "Price"
            type: string
            description: "Leave empty to show 'Quoted after an intro call'. Only put a price here once it is fixed."
      - name: steps
        label: "How it works"
        type: object
        list: true
        description: "Three to five steps, drawn as a process."
        fields:
          - name: name
            label: "Step"
            type: string
            required: true
          - name: detail
            label: "Short detail"
            type: text
            required: true

  - name: team-training
    label: "Team training"
    type: file
    path: src/content/team-training.json
    format: json
    fields:
      - name: topics
        label: "Topics"
        type: object
        list: true
        description: "Two to four, shown as numbered columns."
        fields:
          - name: name
            label: "Topic"
            type: string
            required: true
          - name: detail
            label: "Description"
            type: text
            required: true
      - name: formats
        label: "Formats"
        type: string
        list: true
        description: "For example Online, In person, Blended."

  - name: resources
    label: "Resources page"
    type: file
    path: src/content/resources.json
    format: json
    fields:
      - name: resources
        label: "Templates and resources"
        type: object
        list: true
        description: "The list is a placeholder marked Coming soon. Replace it with the real templates when they exist."
        fields:
          - name: name
            label: "Name"
            type: string
            required: true
          - name: detail
            label: "Description"
            type: text
            required: true

  - name: principles
    label: "About: how we work"
    type: file
    path: src/content/principles.json
    format: json
    fields:
      - name: principles
        label: "Principles"
        type: object
        list: true
        description: "Two to four, shown as numbered columns. Do not promise jobs, salaries or certifications."
        fields:
          - name: name
            label: "Principle"
            type: string
            required: true
          - name: detail
            label: "Description"
            type: text
            required: true
