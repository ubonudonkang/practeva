# Builds the Astro site and publishes it to GitHub Pages on every push to main.
# The custom domain (practevahq.com) is set in the repo's Settings → Pages, not in a CNAME file:
# Pages ignores CNAME files when a workflow deploys the site.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install, build and upload the site
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Tells Bing and the other IndexNow engines (Bing's index also feeds ChatGPT search and
      # Copilot) that the site changed, by sending every URL in the live sitemap. The key file
      # in public/ named after the key proves the site is ours. A failure never fails the deploy.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        env:
          INDEXNOW_KEY: 8ae1a6f7bbdee44cfdb6e16c045553b7
        run: |
          sleep 20
          urls=$(curl -fsS https://practevahq.com/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -sc .)
          curl -fsS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"practevahq.com\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"https://practevahq.com/$INDEXNOW_KEY.txt\",\"urlList\":$urls}" \
            -w 'IndexNow answered %{http_code}\n'
